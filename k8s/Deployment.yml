apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance
  template:
    metadata:
      labels:
        app: attendance
    spec:
      containers:
        - name: attendance
          image: attendance-app:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
  labels:
    app: attendance
spec:
  type: NodePort
  selector:
    app: attendance
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080